name: Update docs sidebar
on:
  push:
    branches: [main]
    paths:
      - 'captures/**'
      - '*.md'
jobs:
  regenerate-sidebar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./generate_sidebar.sh
      # `main` accepts changes only through a pull request (branch protection, 2026-10-08), so the regenerated file goes to the fixed branch
      # bot/docs-sidebar and a pull request is opened for the maintainer to merge; a later run updates the same branch and pull request instead of opening
      # another one. Needs "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
      - name: Open or update a pull request if _sidebar.md changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet _sidebar.md; then echo "_sidebar.md unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c bot/docs-sidebar
          git add _sidebar.md
          git commit -m "docs: auto-regenerate sidebar"
          git push --force origin bot/docs-sidebar
          if [ -z "$(gh pr list --head bot/docs-sidebar --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head bot/docs-sidebar --title "docs: auto-regenerate sidebar" \
              --body "Regenerated by the \`${{ github.workflow }}\` workflow after ${{ github.sha }}. Merge with a merge commit."
          fi
