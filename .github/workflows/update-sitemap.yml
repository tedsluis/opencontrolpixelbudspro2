name: Update sitemap
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/generate_sitemap.py'
jobs:
  regenerate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not the default shallow clone — generate_sitemap.py
          # uses `git log` per file for <lastmod>, which needs it.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: ./scripts/generate_sitemap.py
      # `main` accepts changes only through a pull request (branch protection, 2026-10-08), so the regenerated file goes to the fixed branch
      # bot/sitemap and a pull request is opened for the maintainer to merge; a later run updates the same branch and pull request instead of opening
      # another one. Needs "Allow GitHub Actions to create and approve pull requests" in the repository's Actions settings.
      - name: Open or update a pull request if sitemap.xml changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet sitemap.xml; then echo "sitemap.xml unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c bot/sitemap
          git add sitemap.xml
          git commit -m "docs: auto-regenerate sitemap.xml"
          git push --force origin bot/sitemap
          if [ -z "$(gh pr list --head bot/sitemap --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head bot/sitemap --title "docs: auto-regenerate sitemap.xml" \
              --body "Regenerated by the \`${{ github.workflow }}\` workflow after ${{ github.sha }}. Merge with a merge commit."
          fi
