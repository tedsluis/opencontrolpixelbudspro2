[project]
name = "structural-index"
version = "0.1.0"
description = "General androguard-based reference (construct/call/field-type) search across the decompiled Pixel Buds companion APK. See SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "androguard>=4.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
structural-index = "structural_index.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structural_index"]
