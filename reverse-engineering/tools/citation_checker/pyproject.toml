[project]
name = "citation-checker"
version = "0.1.0"
description = "Checks every file:line citation that the project's markdown documents make into the locally decompiled Pixel Buds companion APK tree. See SPEC.md."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
citation-checker = "citation_checker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_checker"]
