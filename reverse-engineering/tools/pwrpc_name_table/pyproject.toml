[project]
name = "pwrpc-name-table"
version = "0.1.0"
description = "Names the pw_rpc service and method ids seen on the wire by hashing every string literal of the locally decompiled companion APK. See SPEC.md."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pwrpc-name-table = "pwrpc_name_table.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwrpc_name_table"]
