[project]
name = "schema-batch-extractor"
version = "0.1.0"
description = "Batch protobuf-lite RawMessageInfo schema decoder across the whole decompiled Pixel Buds companion APK's JADX source tree. See SPEC.md."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
schema-batch-extractor = "schema_batch_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_batch_extractor"]
