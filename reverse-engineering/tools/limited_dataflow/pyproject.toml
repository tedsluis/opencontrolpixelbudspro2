[project]
name = "limited-dataflow"
version = "0.1.0"
description = "Single-basic-block-only register dataflow trace, built on lambda_dispatcher_resolver's smali reader. See SPEC.md."
requires-python = ">=3.10"
dependencies = [
    "androguard>=4.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
limited-dataflow = "limited_dataflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limited_dataflow"]
